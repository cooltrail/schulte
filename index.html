<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Schulte</title>
  <meta name="description" content="A Schulte table for focus training. Find the numbers in order." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23111114'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-size='14' font-family='Georgia' fill='%23f4e7d0'%3E5%3C/text%3E%3C/svg%3E" />
  <script>
    (function () {
      if (localStorage.getItem('schulte-theme') === 'light') document.documentElement.classList.add('light');
      var bg = localStorage.getItem('schulte-bg');
      var grid = localStorage.getItem('schulte-grid');
      var hit = localStorage.getItem('schulte-hit');
      var menu = localStorage.getItem('schulte-menu');
      if (bg) document.documentElement.style.setProperty('--bg', bg);
      if (grid) document.documentElement.style.setProperty('--grid', grid);
      if (hit) document.documentElement.style.setProperty('--hit', hit);
      if (menu) document.documentElement.style.setProperty('--menu', menu);
    })();
  </script>
  <link rel="stylesheet" href="style.css?v=9" />
</head>
<body>
  <div class="page">
    <header class="mast">
      <div class="brand">
        <h1>Schulte</h1>
        <p id="tagline">Tap 1, then 2, then the rest. Eyes stay on the center.</p>
      </div>
      <button id="theme-btn" type="button" aria-label="Toggle theme">Light</button>
    </header>

    <section class="modes" aria-label="Mode">
      <button class="size-btn on" type="button" data-mode="classic">Classic</button>
      <button class="size-btn" type="button" data-mode="prime">Prime</button>
    </section>

    <section class="sizes" aria-label="Grid size">
      <div id="size-buttons" class="size-row"></div>
    </section>

    <section class="hud">
      <div class="stat">
        <span class="k">Next</span>
        <span id="next" class="v">1</span>
      </div>
      <div id="time-stat" class="stat">
        <span id="time-label" class="k">Look</span>
        <span id="time" class="v">10.00</span>
      </div>
      <div class="stat">
        <span class="k">Best</span>
        <span id="best" class="v">—</span>
      </div>
    </section>

    <main class="stage">
      <div id="board" class="board" role="grid" aria-label="Schulte table"></div>
      <div id="done" class="done hidden">
        <p id="done-copy"></p>
        <button id="again-btn" type="button">New table</button>
      </div>
    </main>

    <footer class="foot">
      <div class="colors" aria-label="Colors">
        <label class="swatch">
          <span>Grid</span>
          <input id="grid-color" type="color" value="#f4e7d0" aria-label="Grid color" />
        </label>
        <label class="swatch">
          <span>Back</span>
          <input id="bg-color" type="color" value="#111114" aria-label="Background color" />
        </label>
        <label class="swatch">
          <span>Click</span>
          <input id="hit-color" type="color" value="#2f6f4e" aria-label="Clicked cell color" />
        </label>
        <label class="swatch">
          <span>Menu</span>
          <input id="menu-color" type="color" value="#1c1b19" aria-label="Menu color" />
        </label>
        <label class="shade">
          <span>Shade</span>
          <input id="grid-alpha" type="range" min="0" max="100" value="100" aria-label="Used cell shade transparency" />
        </label>
      </div>
      <button id="shuffle-btn" type="button">Shuffle</button>
    </footer>
  </div>
  <script src="script.js?v=12"></script>
</body>
</html>
